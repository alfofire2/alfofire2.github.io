# Copia da config.js a index.html i dati che l'estensione del browser legge dalla homepage
# (coupon validi oggi, link e stato della squadra). Parte quando cambia config.js e ogni ora, così la
# squadra si spegne nell'estensione a fine evento e i coupon con dal/al compaiono e spariscono da soli.
# Fa un commit solo se qualcosa cambia. Il commit tocca solo index.html e usa il token di GitHub Actions,
# che non fa ripartire i workflow: niente giri a vuoto.
name: Sincronizza i dati dell'estensione

on:
  push:
    branches: [main]
    paths: [config.js, scripts/sincronizza-estensione.mjs]
  schedule:
    - cron: '7 * * * *'
    # Altri giri a cavallo della mezzanotte italiana (22 e 23 UTC = mezzanotte d'estate e d'inverno),
    # quando i coupon con dal/al cambiano: GitHub salta spesso i giri orari, così c'è più di una possibilità.
    - cron: '2,17,32,47 22,23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sincronizza-estensione
  cancel-in-progress: false

jobs:
  sincronizza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aggiorna index.html da config.js
        run: node scripts/sincronizza-estensione.mjs

      - name: Pubblica se è cambiato qualcosa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- index.html; then
            echo "Niente da aggiornare"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Dati dell'estensione aggiornati da config.js" -- index.html
          git push
          # Chiede comunque una nuova pubblicazione di GitHub Pages, nel caso il push del bot non la avvii
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
